apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: grunn-og-hjelp-oppdrag
  namespace: grunn-og-hjelp
  labels:
    team: grunn-og-hjelp

spec:
  image: {{ image }}
  port: 8087
  envFrom:
    - secret: grunn-og-hjelp-oppdrag
    - secret: grunn-og-hjelp-oppdrag-unleash-api-token
  liveness:
    path: /internal/health/liveness
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /internal/health/readyness
    initialDelay: 30
    failureThreshold: 10
  prometheus:
    enabled: true
    path: /internal/prometheus
  replicas:
    min: 2
    max: 4
  resources:
    limits:
      memory: 700Mi
    requests:
      memory: 700Mi
      cpu: 25m
  ingresses:
    - https://grunn-og-hjelp-oppdrag.intern.dev.nav.no
  gcp:
    sqlInstances:
      - name: grunn-og-hjelp-oppdrag
        type: POSTGRES_18
        tier: db-g1-small
        diskAutoresize: true
        cascadingDelete: false
        highAvailability: false
        pointInTimeRecovery: true
        maintenance:
          day: 7
          hour: 23
        databases:
          - name: grunn-og-hjelp-oppdrag
            envVarPrefix: DB

  azure:
    application:
      enabled: true
      allowAllUsers: true
  accessPolicy:
    inbound:
      rules:
        - application: grunn-og-hjelpestonad
          cluster: dev-gcp
    outbound:
      rules:
        - application: logging
          namespace: nais-system
      external:
        - host: b27apvl220.preprod.local
          ports:
            - port: 1413
        - host: familie-ws-proxy.dev-fss-pub.nais.io
        #- host: teamfamilie-unleash-api.nav.cloud.nais.io legg til egen unleash?

  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: preprod
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MinRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
    - name: OPPDRAG_MQ_MOTTAK_ENABLED
      value: "true"
